<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaSave Search Engine</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #fafafa; color: #262626; padding: 15px; margin: 0; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 22px; text-align: center; margin-bottom: 20px; }
    .card { background: white; border: 1px solid #dbdbdb; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #dbdbdb; font-size: 14px; }
    button { background-color: #0095f6; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:disabled { background-color: #b2dffc; }
    .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .meta-item { font-size: 13px; margin: 6px 0; }
    hr { border: 0; border-top: 1px solid #efefef; margin: 12px 0; }
    .chart-container { height: 200px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 InstaSave AI Netlify Search Vault</h1>
    
    <div class="card">
      <h3>📥 Sync New Instagram Post</h3>
      <input type="text" id="newUrl" placeholder="Paste instagram.com URL here...">
      <button id="syncBtn" onclick="syncLink()">🚀 Process & Save Post</button>
      <div id="syncStatus" style="margin-top:10px; font-size:13px;"></div>
    </div>

    <div class="card">
      <h3>📊 Your Collection Insights</h3>
      <p id="totalCount" style="font-size: 15px; font-weight: bold; margin: 5px 0;">Total Saved: Loading...</p>
      <div class="chart-container"><canvas id="analyticsChart"></canvas></div>
    </div>

    <div class="card">
      <h3>🎛️ Search & Refine Options</h3>
      <input type="text" id="searchBox" oninput="renderFeed()" placeholder="Type to search captions, topics, ingredients...">
      <select id="categoryFilter" onchange="renderFeed()"><option value="All">All Categories</option></select>
    </div>

    <div id="feedContainer"></div>
  </div>

  <script>
    let rawDatabase = [];
    let chartInstance = null;

    async function loadDatabase() {
      try {
        const res = await fetch('saved_posts.json?nocache=' + Date.now());
        const data = await res.json();
        
        // Fail-safe logic to unpack objects or flat list variants seamlessly
        if (Array.isArray(data)) {
          rawDatabase = data;
        } else if (typeof data === 'object' && data !== null) {
          const keys = Object.keys(data);
          // Look for an item that holds the list array (e.g. saved_saved_media)
          const nestedKey = keys.find(k => Array.isArray(data[k]));
          rawDatabase = nestedKey ? data[nestedKey] : Object.values(data);
          
          // Flatten array elements one level deep if Instagram bundled a secondary nested list array
          if (rawDatabase.length > 0 && Array.isArray(rawDatabase[0])) {
            rawDatabase = rawDatabase.flat();
          }
        }

        // Clean null properties out of the payload mix before processing
        rawDatabase = rawDatabase.filter(item => item && typeof item === 'object');

        setupFiltersAndAnalytics();
        renderFeed();
      } catch (err) {
        console.error("Critical dashboard initialization error:", err);
        document.getElementById('totalCount').innerText = "❌ Structure Parsing Error: Check JSON layout configuration.";
      }
    }

    function extractItemData(item) {
      let url = "";
      let date = "Unknown Date";
      let rawTags = item.tags || item.AI_Semantic_Tags || "";

      // 1. Unpack Date securely
      if (item.timestamp) {
        if (!isNaN(item.timestamp)) {
          date = new Date(Number(item.timestamp) * 1000).toLocaleDateString();
        } else {
          date = String(item.timestamp);
        }
      }

      // 2. Reconstruct functional links directly using your unique 'fid' keys
      if (item.fid) {
        url = `https://instagram.com{item.fid}/`;
      } else if (item.media && typeof item.media === 'object') {
        const targetId = item.media.id || item.media.fid;
        url = targetId ? `https://instagram.com{targetId}/` : (item.media.uri || item.media.url || "");
      } else if (typeof item.media === 'string') {
        url = item.media;
      }

      if (!url || !url.startsWith('http')) {
        url = item.url || item.uri || "https://instagram.com";
      }

      // 3. Fallback tracking descriptive logs 
      let parsed = { topic: 'Uncategorized', details: 'None', summary: 'Click Sync New Post above to generate smart labels.' };
      
      if (rawTags && typeof rawTags === 'string' && rawTags.includes(' | ')) {
        const parts = {};
        rawTags.split(' | ').forEach(pt => {
          const [key, val] = pt.split(': ');
          if (key && val) parts[key.trim().toLowerCase()] = val.trim();
        });
        parsed = { 
          topic: parts.topic || 'Uncategorized', 
          details: parts.details || 'None', 
          summary: parts.summary || 'AI Synced.' 
        };
      } else if (item.title) {
        parsed.summary = String(item.title);
      } else if (item.fid) {
        parsed.summary = `Saved Asset Post Module Card (ID Code Reference: ${item.fid})`;
      }

      const matchString = (String(url) + " " + String(date) + " " + String(parsed.topic) + " " + String(parsed.details) + " " + String(parsed.summary)).toLowerCase();

      return { url, date, ...parsed, rawString: matchString };
    }

    function setupFiltersAndAnalytics() {
      document.getElementById('totalCount').innerText = `Total Saved Items: ${rawDatabase.length}`;
      
      const counts = {};
      rawDatabase.forEach(item => {
        const info = extractItemData(item);
        counts[info.topic] = (counts[info.topic] || 0) + 1;
      });

      const dropdown = document.getElementById('categoryFilter');
      dropdown.innerHTML = '<option value="All">All Categories</option>';
      Object.keys(counts).sort().forEach(cat => {
        dropdown.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      const ctx = document.getElementById('analyticsChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      
      // If no valid data records map yet, create a clean zero data layout state wrapper
      const labels = Object.keys(counts).length ? Object.keys(counts) : ["Uncategorized"];
      const chartData = Object.values(counts).length ? Object.values(counts) : [rawDatabase.length];

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ data: chartData, backgroundColor: '#0095f6' }]
        },
        options: { 
          indexAxis: 'y', 
          responsive: true, 
          maintainAspectRatio: false, 
          plugins: { legend: { display: false } },
          scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
        }
      });
    }

    function renderFeed() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      const filter = document.getElementById('categoryFilter').value;
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      const itemsToRender = [...rawDatabase].reverse();
      let matchesCount = 0;

      itemsToRender.forEach(item => {
        const info = extractItemData(item);
        const matchesSearch = info.rawString.includes(query);
        const matchesFilter = filter === 'All' || info.topic === filter;

        if (matchesSearch && matchesFilter) {
          matchesCount++;
          container.innerHTML += `
            <div class="card">
              <span class="badge">${info.topic}</span>
              <p class="meta-item"><strong>📅 Date Logged:</strong> ${info.date}</p>
              ${info.details !== 'None' ? `<p class="meta-item"><strong>📦 Extracted Details:</strong> <em>${info.details}</em></p>` : ''}
              <p class="meta-item"><strong>📝 Description:</strong> ${info.summary}</p>
              <hr>
              <button onclick="window.open('${info.url}', '_blank')">Open Original Link ↗️</button>
            </div>`;
        }
      });
      
      if (matchesCount === 0) {
        container.innerHTML = '<div class="card" style="text-align:center;color:gray;">No matching item cards found.</div>';
      }
    }

    async function syncLink() {
      const urlInput = document.getElementById('newUrl');
      const btn = document.getElementById('syncBtn');
      const status = document.getElementById('syncStatus');
      const targetUrl = urlInput.value.trim();

      if (!targetUrl.includes('instagram.com')) {
        status.innerHTML = '<span style="color:red">❌ Invalid link string format.</span>';
        return;
      }

      btn.disabled = true;
      status.innerText = '🤖 Processing link via Netlify functions...';

      try {
        const response = await fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: targetUrl })
        });
        const result = await response.json();

        if (result.success) {
          status.innerHTML = '<span style="color:green">🎉 Saved! Updating repository...</span>';
          urlInput.value = '';
          setTimeout(() => { location.reload(); }, 1500);
        } else {
          status.innerHTML = `<span style="color:red">❌ Error: ${result.error || 'Duplicate'}</span>`;
          btn.disabled = false;
        }
      } catch (err) {
