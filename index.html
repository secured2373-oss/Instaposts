<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaSave Search Engine</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #fafafa; color: #262626; padding: 15px; margin: 0; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 22px; text-align: center; margin-bottom: 20px; }
    .card { background: white; border: 1px solid #dbdbdb; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #dbdbdb; font-size: 14px; }
    button { background-color: #0095f6; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:disabled { background-color: #b2dffc; }
    .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .meta-item { font-size: 13px; margin: 6px 0; }
    hr { border: 0; border-top: 1px solid #efefef; margin: 12px 0; }
    .chart-container { height: 200px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 InstaSave AI Search Vault</h1>
    
    <!-- Sync New Link Section -->
    <div class="card">
      <h3>📥 Sync New Instagram Post</h3>
      <input type="text" id="newUrl" placeholder="Paste instagram.com URL here...">
      <button id="syncBtn" onclick="syncLink()">🚀 Process & Save Post</button>
      <div id="syncStatus" style="margin-top:10px; font-size:13px;"></div>
    </div>

    <!-- Analytics Section -->
    <div class="card">
      <h3>📊 Your Collection Insights</h3>
      <p id="totalCount" style="font-size: 15px; font-weight: bold; margin: 5px 0;">Total Saved: Loading...</p>
      <div class="chart-container"><canvas id="analyticsChart"></canvas></div>
    </div>

    <!-- Controls Section -->
    <div class="card">
      <h3>🎛️ Search & Refine Options</h3>
      <input type="text" id="searchBox" oninput="renderFeed()" placeholder="Type to search captions, topics, ingredients...">
      <select id="categoryFilter" onchange="renderFeed()"><option value="All">All Categories</option></select>
    </div>

    <!-- Feed Results Container -->
    <div id="feedContainer"></div>
  </div>

  <script>
    let rawDatabase = [];
    let chartInstance = null;

    // Automatically load your data file on startup
    async function loadDatabase() {
      try {
        const res = await fetch('my_instagram_links_vault.json?nocache=' + Date.now());
        rawDatabase = await res.json();
        setupFiltersAndAnalytics();
        renderFeed();
      } catch (err) {
        console.error("Failed to load database file structure:", err);
      }
    }

    function parseTags(tagString) {
      if (!tagString || !tagString.includes(' | ')) {
        return { topic: 'General', details: 'None', summary: tagString || 'No data.' };
      }
      const parts = {};
      tagString.split(' | ').forEach(item => {
        const [key, val] = item.split(': ');
        if (key && val) parts[key.trim().toLowerCase()] = val.trim();
      });
      return { topic: parts.topic || 'General', details: parts.details || 'None', summary: parts.summary || 'No data.' };
    }

    function setupFiltersAndAnalytics() {
      document.getElementById('totalCount').innerText = `Total Saved Items: ${rawDatabase.length}`;
      
      const counts = {};
      rawDatabase.forEach(item => {
        const info = parseTags(item.tags);
        counts[info.topic] = (counts[info.topic] || 0) + 1;
      });

      // Update Filter Dropdown
      const dropdown = document.getElementById('categoryFilter');
      dropdown.innerHTML = '<option value="All">All Categories</option>';
      Object.keys(counts).sort().forEach(cat => {
        dropdown.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      // Draw Chart.js Bar Chart
      const ctx = document.getElementById('analyticsChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(counts),
          datasets: [{ data: Object.values(counts), backgroundColor: '#0095f6' }]
        },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    function renderFeed() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      const filter = document.getElementById('categoryFilter').value;
      const container = document.getElementById('feedContainer');
      container.innerHTML = '';

      // Reverse list to show newest items first
      const itemsToRender = [...rawDatabase].reverse();

      itemsToRender.forEach(item => {
        const info = parseTags(item.tags);
        const matchesSearch = item.url.toLowerCase().includes(query) || item.tags.toLowerCase().includes(query);
        const matchesFilter = filter === 'All' || info.topic === filter;

        if (matchesSearch && matchesFilter) {
          container.innerHTML += `
            <div class="card">
              <span class="badge">${info.topic}</span>
              <p class="meta-item"><strong>📅 Date Logged:</strong> ${item.date}</p>
              <p class="meta-item"><strong>📦 Extracted Elements:</strong> <em>${info.details}</em></p>
              <p class="meta-item"><strong>📝 AI Summary:</strong> ${info.summary}</p>
              <hr>
              <button onclick="window.open('${item.url}', '_blank')">Open Original Link ↗️</button>
            </div>`;
        }
      });
    }

    async function syncLink() {
      const urlInput = document.getElementById('newUrl');
      const btn = document.getElementById('syncBtn');
      const status = document.getElementById('syncStatus');
      const targetUrl = urlInput.value.trim();

      if (!targetUrl.includes('instagram.com')) {
        status.innerHTML = '<span style="color:red">❌ Invalid Instagram address link.</span>';
        return;
      }

      btn.disabled = true;
      status.innerText = '🤖 Processing link via Gemini serverless function...';

      try {
        // Calls the background Node.js api function inside your app layout
        const response = await fetch('/api/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: targetUrl })
        });
        const result = await response.json();

        if (result.success) {
          status.innerHTML = '<span style="color:green">🎉 Saved! Reloading app database...</span>';
          urlInput.value = '';
          setTimeout(() => { location.reload(); }, 1500);
        } else {
          status.innerHTML = `<span style="color:red">❌ Error: ${result.error || 'Duplicate'}</span>`;
          btn.disabled = false;
        }
      } catch (err) {
        status.innerHTML = `<span style="color:red">❌ Network Error: ${err.message}</span>`;
        btn.disabled = false;
      }
    }

    window.onload = loadDatabase;
  </script>
</body>
</html>
